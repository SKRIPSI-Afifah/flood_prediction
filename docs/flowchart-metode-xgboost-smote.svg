<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2500" viewBox="0 0 1700 2500" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart Metode XGBoost dan SMOTE</title>
  <desc id="desc">Diagram alur metodologi pembentukan model prediksi kerawanan banjir dengan tahapan pemuatan data, praproses, penyeimbangan kelas, pelatihan model, evaluasi, dan penyimpanan hasil.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbfe" />
      <stop offset="100%" stop-color="#edf4f8" />
    </linearGradient>
    <linearGradient id="startFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4c81" />
      <stop offset="100%" stop-color="#0ea5a6" />
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f3b57" />
    </marker>
    <style>
      .bg { fill: url(#pageBg); }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #10263d; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #5a7086; }
      .section { font: 700 13px Arial, Helvetica, sans-serif; fill: #5c7186; letter-spacing: 0.16em; }
      .text { font: 700 20px Arial, Helvetica, sans-serif; fill: #10263d; }
      .text-sm { font: 700 18px Arial, Helvetica, sans-serif; fill: #10263d; }
      .text-inv { font: 700 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .line { stroke: #1f3b57; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #6f8599; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .process { fill: #ffffff; stroke: #7aa0bf; stroke-width: 3; }
      .io { fill: #eef8f8; stroke: #5da9a8; stroke-width: 3; }
      .decision { fill: #f8fbff; stroke: #6588a8; stroke-width: 3; }
      .terminator { fill: url(#startFill); stroke: #0c416d; stroke-width: 3; }
      .note { font: 400 14px Arial, Helvetica, sans-serif; fill: #6a7f94; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="2500" />
  <text class="title" x="850" y="58" text-anchor="middle">Flowchart Metode XGBoost dan SMOTE</text>
  <text class="subtitle" x="850" y="86" text-anchor="middle">Alur pelatihan model dan evaluasi hasil untuk penelitian prediksi kerawanan banjir</text>

  <text class="section" x="850" y="150" text-anchor="middle">ALUR METODE</text>
  <ellipse class="terminator" cx="850" cy="220" rx="145" ry="34" />
  <text class="text-inv" x="850" y="228" text-anchor="middle">Mulai</text>

  <line class="line" x1="850" y1="254" x2="850" y2="318" />
  <rect class="process" x="500" y="318" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="366" text-anchor="middle">Pemuatan dataset penelitian</text>

  <line class="line" x1="850" y1="396" x2="850" y2="466" />
  <rect class="process" x="500" y="466" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="514" text-anchor="middle">Penyelarasan label target</text>

  <line class="line" x1="850" y1="544" x2="850" y2="614" />
  <rect class="process" x="500" y="614" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="662" text-anchor="middle">Pemilihan atribut penelitian</text>

  <line class="line" x1="850" y1="692" x2="850" y2="762" />
  <rect class="process" x="500" y="762" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="810" text-anchor="middle">Penanganan nilai hilang</text>

  <line class="line" x1="850" y1="840" x2="850" y2="910" />
  <rect class="process" x="500" y="910" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="958" text-anchor="middle">Pengubahan label ke bentuk numerik</text>

  <line class="line" x1="850" y1="988" x2="850" y2="1060" />
  <polygon class="decision" points="850,1060 1080,1140 850,1220 620,1140" />
  <text class="text" x="850" y="1134" text-anchor="middle">Data dibagi menjadi</text>
  <text class="text" x="850" y="1160" text-anchor="middle">data latih dan data uji</text>

  <path class="line-soft" d="M620 1140 L510 1140 L510 930 L500 930" />
  <line class="line" x1="850" y1="1220" x2="850" y2="1292" />
  <rect class="io" x="460" y="1292" width="780" height="82" rx="12" ry="12" transform="skewX(-12)" />
  <text class="text" x="850" y="1343" text-anchor="middle">Penyeimbangan kelas dengan SMOTE pada data latih</text>

  <line class="line" x1="850" y1="1374" x2="850" y2="1446" />
  <rect class="process" x="500" y="1446" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="1494" text-anchor="middle">Pelatihan model klasifikasi XGBoost</text>

  <line class="line" x1="850" y1="1524" x2="850" y2="1596" />
  <rect class="process" x="500" y="1596" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="1644" text-anchor="middle">Evaluasi model menggunakan data uji</text>

  <line class="line" x1="850" y1="1674" x2="850" y2="1746" />
  <rect class="process" x="500" y="1746" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="1794" text-anchor="middle">Prediksi seluruh data penelitian</text>

  <line class="line" x1="850" y1="1824" x2="850" y2="1896" />
  <rect class="process" x="500" y="1896" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="1944" text-anchor="middle">Perhitungan probabilitas dan skor risiko</text>

  <line class="line" x1="850" y1="1974" x2="850" y2="2046" />
  <rect class="process" x="500" y="2046" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="2094" text-anchor="middle">Klasifikasi tingkat kerawanan</text>

  <line class="line" x1="850" y1="2124" x2="850" y2="2196" />
  <rect class="process" x="500" y="2196" width="700" height="78" rx="18" ry="18" />
  <text class="text" x="850" y="2244" text-anchor="middle">Penyimpanan model dan hasil prediksi</text>

  <line class="line" x1="850" y1="2274" x2="850" y2="2346" />
  <ellipse class="terminator" cx="850" cy="2410" rx="145" ry="34" />
  <text class="text-inv" x="850" y="2418" text-anchor="middle">Selesai</text>

  <text class="note" x="850" y="2460" text-anchor="middle">SMOTE digunakan pada data latih untuk mengatasi ketidakseimbangan kelas sebelum pelatihan model XGBoost.</text>
</svg>
